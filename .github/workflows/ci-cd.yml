# Build → Test → Package → Deploy → Monitor
# Broken code should fail here before users see it.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_URL   — Render "Deploy Hook" for incentra-backend
#   VERCEL_DEPLOY_HOOK_URL   — Vercel Deploy Hook for the frontend project
#   BACKEND_BASE_URL         — e.g. https://api.incentra.co.in  (no trailing slash)
#   FRONTEND_BASE_URL        — e.g. https://incentra.co.in
#
# Also: turn OFF platform auto-deploy on main (Render + Vercel) so only this
# workflow deploys after tests pass. Require the "CI/CD" checks on main.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TEST (backend) ───────────────────────────────────────────────
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_comp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      CREDENTIALS_ENCRYPTION_KEY: ci-credentials-encryption-key
      DB_NAME: sales_comp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Migrate
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: python manage.py test commissions.tests --verbosity=1

  # ─── BUILD (frontend) ─────────────────────────────────────────────
  build-frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Production build
        working-directory: frontend
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          REACT_APP_API_BASE_URL: https://example.invalid/api
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  # ─── PACKAGE (Docker image) ───────────────────────────────────────
  package:
    name: Package (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: incentra-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image imports the Django app
        run: |
          set -euo pipefail
          docker run --rm \
            -e SECRET_KEY=ci-package-secret \
            -e DEBUG=True \
            -e DB_ENGINE=django.db.backends.sqlite3 \
            -e DB_NAME=:memory: \
            incentra-backend:ci \
            python -c "import django; import config.wsgi; print('package-ok', django.get_version())"

  # ─── QUALITY GATE ─────────────────────────────────────────────────
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, package]
    steps:
      - name: All checks passed
        run: echo "Build, test, and package succeeded."

  # ─── DEPLOY (main only, after gate, when hooks configured) ────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Trigger Render backend deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — skip backend deploy hook."
            echo "Set the secret and disable Render auto-deploy so only CI deploys after tests."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered."

      - name: Trigger Vercel frontend deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret not set — skip frontend deploy hook."
            echo "Set the secret and disable Vercel auto-deploy so only CI deploys after tests."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel deploy hook triggered."

  # ─── MONITOR (smoke production after deploy) ──────────────────────
  monitor:
    name: Monitor (smoke)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Wait for platforms to roll out
        run: sleep 90

      - name: Smoke-check backend health
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_BASE_URL:-}" ]; then
            echo "::warning::BACKEND_BASE_URL secret not set — skip backend smoke checks."
            exit 0
          fi
          BASE="${BACKEND_BASE_URL%/}"
          for path in /ping /api/health/ /api/health/ready/; do
            echo "GET ${BASE}${path}"
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS --max-time 15 "${BASE}${path}" -o /tmp/smoke-body.txt; then
                echo "OK ${path}"
                cat /tmp/smoke-body.txt || true
                echo
                ok=1
                break
              fi
              echo "attempt $i failed, retrying..."
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Smoke check failed for ${BASE}${path}"
              exit 1
            fi
          done

      - name: Smoke-check frontend
        env:
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_BASE_URL:-}" ]; then
            echo "::warning::FRONTEND_BASE_URL secret not set — skip frontend smoke check."
            exit 0
          fi
          URL="${FRONTEND_BASE_URL%/}/"
          echo "GET $URL"
          code=$(curl -sS -o /tmp/fe.html -w "%{http_code}" --max-time 30 "$URL")
          if [ "$code" != "200" ]; then
            echo "::error::Frontend returned HTTP $code"
            exit 1
          fi
          if ! grep -qi "Incentra\|root\|script" /tmp/fe.html; then
            echo "::error::Frontend HTML did not look like the app shell"
            exit 1
          fi
          echo "Frontend smoke OK"
