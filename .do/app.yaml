# DigitalOcean App Platform spec — template
# 1. Replace github.repo with your repository (owner/name)
# 2. Apps → Create App → Upload App Spec, or doctl apps create --spec .do/app.yaml
# 3. Set SECRET_KEY and domain env vars in the DO dashboard after first deploy

name: incentivepro
region: blr1

domains:
  - domain: incentra.co.in
    type: PRIMARY
  - domain: www.incentra.co.in
    type: ALIAS

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: incentivepro-db
    engine: PG
    version: "16"
    production: true
    cluster_name: incentivepro-db

static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/sales-comp-platform
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm install && CI=false npm run build
    output_dir: build
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: REACT_APP_API_HOST
        value: https://api.incentra.co.in
        scope: BUILD_TIME
      - key: REACT_APP_API_BASE_URL
        value: https://api.incentra.co.in/api
        scope: BUILD_TIME
      - key: REACT_APP_USE_HTTPS
        value: "true"
        scope: BUILD_TIME
      - key: REACT_APP_DEBUG
        value: "false"
        scope: BUILD_TIME

services:
  - name: api
    github:
      repo: YOUR_GITHUB_USER/sales-comp-platform
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: CHANGE_ME_IN_DO_DASHBOARD
        type: SECRET
      - key: DATABASE_URL
        value: ${incentivepro-db.DATABASE_URL}
        scope: RUN_TIME
      - key: ALLOWED_HOSTS
        value: api.incentra.co.in,${api.PUBLIC_URL}
      - key: CORS_ALLOWED_ORIGINS
        value: https://incentra.co.in,https://www.incentra.co.in,${web.PUBLIC_URL}
      - key: FRONTEND_URL
        value: https://incentra.co.in
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
