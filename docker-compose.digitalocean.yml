# DigitalOcean Droplet production overrides
# Usage:
#   cp deploy/digitalocean.env.example backend/.env  # edit secrets + hosts
#   docker compose -f docker-compose.yml -f docker-compose.digitalocean.yml up -d --build

services:
  db:
    environment:
      POSTGRES_USER: incentra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}

  api:
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_USER: incentra
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: sales_comp_db
      ALLOWED_HOSTS: api.incentra.co.in,incentra.co.in,www.incentra.co.in
      CORS_ALLOWED_ORIGINS: https://incentra.co.in,https://www.incentra.co.in
      FRONTEND_URL: https://incentra.co.in
      CELERY_TASK_ALWAYS_EAGER: "True"
    ports:
      - "8000:8000"

  worker:
    environment:
      DB_USER: incentra
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
