databases:
  - name: incentra-db
    databaseName: sales_comp_db
    user: sales_comp_user

services:
  - type: web
    name: incentra-backend
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /ping
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash -c 'for i in 1 2 3 4 5 6; do python manage.py migrate --noinput && break; echo "migrate attempt $$i failed, retrying in 10s..."; sleep 10; done && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: incentra-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: api.incentra.co.in,incentra-backend.onrender.com,.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: USE_ASYNC_IMPORTS
        value: "False"
