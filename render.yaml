# Optional Render Blueprint — import in Render Dashboard or deploy via render.com/docs/blueprint-spec
# Custom domains: api.incentra.co.in (web), incentra.co.in on Vercel (frontend)

services:
  - type: web
    name: incentivepro-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.incentra.co.in,.onrender.com
      # Add your exact Vercel URL(s); *.vercel.app is also allowed via regex in settings.py
      - key: CORS_ALLOWED_ORIGINS
        value: https://incentra.co.in,https://www.incentra.co.in
      - key: FRONTEND_URL
        value: https://incentra.co.in
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: incentivepro-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

databases:
  - name: incentivepro-db
    plan: basic-256mb
    databaseName: sales_comp_db
    user: incentra
